name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行自检（参考实现 + 自测用例 + 链接）
        run: python3 scripts/selfcheck.py
