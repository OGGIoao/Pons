name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行自检（参考实现 + 自测用例 + 链接）
        run: python3 scripts/selfcheck.py

  # push 成功后通知展示层用最新内容重建部署（PR 不触发）
  dispatch:
    needs: selfcheck
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 通知 Pons-web 重新部署
        run: |
          gh api repos/OGGIoao/Pons-web/dispatches \
            -f event_type=content-updated
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
